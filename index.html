<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartFormIO Demo</title>
    <link rel="stylesheet" href="parent-styles.css" />
  </head>
  <body>
    <script>
      const formSchema = {
        title: "Validation Demo Form",
        validateOnChange: true,
        fields: [
          {
            type: "email",
            name: "email",
            label: "Email",
            required: true,
            validationMessage: "Please enter a valid email address",
            pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$",
            helpText: "Enter your email address",
          },
          {
            type: "number",
            name: "age",
            label: "Age",
            required: true,
            min: 18,
            max: 100,
            validationMessage: "Age must be between 18 and 100",
            helpText: "You must be between 18 and 100 years old",
          },
          {
            type: "number",
            name: "score",
            label: "Score",
            required: true,
            min: 0,
            max: 10,
            validationMessage: "Score must be between 0 and 10",
            helpText: "Enter a score from 0 to 10",
          },
          {
            type: "text",
            name: "phone",
            label: "Phone Number",
            required: true,
            pattern: "^\\d{10}$",
            validationMessage: "Please enter a valid 10-digit phone number",
            helpText:
              "Enter your 10-digit phone number without spaces or dashes",
          },
          {
            type: "password",
            name: "password",
            label: "Password",
            required: true,
            minLength: 8,
            pattern: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$",
            validationMessage:
              "Password must be at least 8 characters with letters and numbers",
            helpText: "Use at least 8 characters with both letters and numbers",
          },
        ],
      };
    </script>

    <smart-form-io id="myForm"></smart-form-io>

    <script type="module" src="./dist/smartformio.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formElement = document.getElementById("myForm");
        formElement.setAttribute("schema", JSON.stringify(formSchema));

        formElement.addEventListener("smartformio:submit", (e) => {
          console.log("Form submitted with data:", e.detail);
        });
      });
    </script>
  </body>
</html>
