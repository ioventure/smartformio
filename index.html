<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartFormIO Input Types Demo</title>
    <link rel="stylesheet" href="/parent-styles.css" />
  </head>
  <body>
    <script>
      const formSchema = {
        title: "SmartFormIO Input Types Demo",
        description:
          "This form demonstrates all input types and their features",
        validateOnChange: true,
        fields: [
          {
            type: "text",
            name: "username",
            label: "Username",
            required: true,
            minLength: 3,
            maxLength: 20,
            pattern: "^[a-zA-Z0-9_]+$",
            validationMessage:
              "Username must be 3-20 characters, using only letters, numbers, and underscore",
            helpText: "Choose a unique username",
            placeholder: "johndoe123",
            leadingIcon: "👤",
            trailingIcon: "❓",
          },
          {
            type: "email",
            name: "email",
            label: "Email Address",
            required: true,
            validationMessage: "Please enter a valid email address",
            pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$",
            helpText: "We'll never share your email",
            placeholder: "john@example.com",
            leadingIcon: "📧",
            trailingIcon: "❓",
          },
          {
            type: "password",
            name: "password",
            label: "Password",
            required: true,
            minLength: 8,
            pattern: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$",
            validationMessage:
              "Password must be at least 8 characters with letters and numbers",
            helpText: "Use at least 8 characters with both letters and numbers",
            leadingIcon: "🔒",
            trailingIcon: "❓",
          },
          {
            type: "number",
            name: "age",
            label: "Age",
            required: true,
            min: 18,
            max: 100,
            validationMessage: "Age must be between 18 and 100",
            helpText: "Enter your age",
            placeholder: "25",
            leadingIcon: "🎂",
            trailingIcon: "❓",
          },
          {
            type: "textarea",
            name: "bio",
            label: "Biography",
            maxLength: 500,
            validationMessage: "Biography cannot exceed 500 characters",
            helpText: "Tell us about yourself",
            placeholder: "Write a short bio...",
            leadingIcon: "📝",
            trailingIcon: "❓",
          },
          {
            type: "select",
            name: "country",
            label: "Country",
            required: true,
            options: [
              "Select a country",
              "United States",
              "United Kingdom",
              "Canada",
              "Australia",
              "Germany",
              "France",
              "Japan",
              "India",
            ],
            validationMessage: "Please select your country",
            helpText: "Select your country of residence",
            leadingIcon: "🌍",
          },
          {
            type: "date",
            name: "birthdate",
            label: "Birth Date",
            required: true,
            min: "1920-01-01",
            max: "2005-12-31",
            validationMessage:
              "Please enter a valid date between 1920 and 2005",
            helpText: "Enter your date of birth",
            leadingIcon: "📅",
          },
        ],
      };
    </script>

    <smart-form-io id="myForm"></smart-form-io>

    <script type="module" src="/dist/smartformio.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formElement = document.getElementById("myForm");
        formElement.setAttribute("schema", JSON.stringify(formSchema));

        formElement.addEventListener("smartformio:submit", (e) => {
          console.log("Form submitted with data:", e.detail);
        });
      });
    </script>
  </body>
</html>
