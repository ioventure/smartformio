<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartFormIO Demo</title>
    <!-- Include the parent application's stylesheet -->
    <link rel="stylesheet" href="parent-styles.css" />
  </head>
  <body>
    <!-- Define the form schema as a script variable -->
    <script>
      const formSchema = {
        title: "User Preferences",
        fields: [
          {
            type: "text",
            name: "username",
            label: "Username",
            required: true,
            placeholder: "Enter your username",
          },
          {
            type: "email",
            name: "email",
            label: "Email",
            required: true,
            placeholder: "Enter your email address",
          },
          {
            type: "password",
            name: "password",
            label: "Password",
            required: true,
            placeholder: "Enter your password",
          },
          {
            type: "checkbox",
            name: "notifications",
            label: "Notification Preferences",
            options: ["New comments", "New candidates", "Offers"],
            descriptions: [
              "so you always know what's happening.",
              "who apply for any open postings.",
              "when they are accepted or rejected by candidates.",
            ],
            required: false,
          },
        ],
      };
    </script>

    <!-- SmartFormIO component -->
    <smart-form-io id="myForm"></smart-form-io>

    <!-- Include the component bundle -->
    <script type="module" src="./dist/smartformio.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formElement = document.getElementById("myForm");
        formElement.setAttribute("schema", JSON.stringify(formSchema));

        formElement.addEventListener("smartformio:submit", (e) => {
          console.log("Form submitted with data:", e.detail);
        });
      });
    </script>
  </body>
</html>
