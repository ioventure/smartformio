<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartFormIO Complete Demo</title>
    <link rel="stylesheet" href="/parent-styles.css" />
  </head>
  <body>
    <script>
      const formSchema = {
        title: "SmartFormIO Complete Demo",
        description:
          "This form demonstrates all input types and their validations",
        validateOnChange: true,
        // Add API configuration
        api: {
          endpoint: "https://dummyjson.com/test",
          method: "POST",
          timeout: 5000,
        },
        fields: [
          {
            type: "text",
            name: "username",
            label: "Username",
            required: true,
            minLength: 3,
            maxLength: 20,
            pattern: "^[a-zA-Z0-9_]+$",
            validationMessage:
              "Username must be 3-20 characters, using only letters, numbers, and underscore",
            helpText: "Choose a unique username",
            placeholder: "johndoe123",
            leadingIcon: "👤",
            value: "testuser",
          },
          {
            type: "email",
            name: "email",
            label: "Email Address",
            required: true,
            pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$",
            validationMessage: "Please enter a valid email address",
            helpText: "We'll never share your email",
            placeholder: "john@example.com",
            leadingIcon: "📧",
            value: "test@example.com",
          },
          {
            type: "password",
            name: "password",
            label: "Password",
            required: true,
            minLength: 8,
            pattern: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$",
            placeholder: "Use at least 8 characters with letters and numbers",
            validationMessage:
              "Password must be at least 8 characters with letters and numbers",
            helpText: "Use at least 8 characters with both letters and numbers",
            leadingIcon: "🔒",
            value: "Password123",
          },
          {
            type: "number",
            name: "age",
            label: "Age",
            required: true,
            min: 18,
            max: 100,
            validationMessage: "Age must be between 18 and 100",
            helpText: "Enter your age",
            placeholder: "25",
            leadingIcon: "🎂",
            value: "25",
          },
          {
            type: "select",
            name: "country",
            label: "Country",
            required: true,
            options: [
              { value: "", label: "Select a country" },
              { value: "us", label: "United States" },
              { value: "uk", label: "United Kingdom" },
              { value: "ca", label: "Canada" },
              { value: "au", label: "Australia" },
            ],
            validationMessage: "Please select your country",
            helpText: "Select your country of residence",
            leadingIcon: "🌍",
            value: "us",
          },
          {
            type: "date",
            name: "birthdate",
            label: "Birth Date",
            required: true,
            min: "1920-01-01",
            max: "2005-12-31",
            validationMessage:
              "Please enter a valid date between 1920 and 2005",
            helpText: "Enter your date of birth",
            leadingIcon: "📅",
            value: "1990-01-01",
          },
          {
            type: "radio",
            name: "gender",
            label: "Gender",
            required: true,
            options: [
              { value: "male", label: "Male" },
              { value: "female", label: "Female" },
              { value: "other", label: "Other" },
            ],
            validationMessage: "Please select your gender",
            display: "horizontal",
            value: "male",
          },
          {
            type: "checkbox",
            name: "terms",
            label: "Terms & Conditions",
            required: true,
            validationMessage: "You must accept the terms and conditions",
            description: "I agree to the terms and conditions",
            value: true,
          },
        ],
      };
    </script>

    <smart-form-io id="myForm"></smart-form-io>

    <script type="module" src="/dist/smartformio.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formElement = document.getElementById("myForm");
        formElement.setAttribute("schema", JSON.stringify(formSchema));

        // Listen for all form events
        formElement.addEventListener("smartformio:submit", (e) => {
          console.log("Form submitted with data:", e.detail);
        });

        formElement.addEventListener("smartformio:success", (e) => {
          console.log("Form submission successful:", e.detail);
          const { data, response } = e.detail;
          console.log("Submitted data:", data);
          console.log("API response:", response);
        });

        formElement.addEventListener("smartformio:error", (e) => {
          console.error("Form submission failed:", e.detail);
          const { data, error } = e.detail;
          console.error("Error submitting data:", data);
          console.error("Error details:", error);
        });
      });
    </script>
  </body>
</html>
