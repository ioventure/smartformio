<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartFormIO Checkbox Demo</title>
    <link rel="stylesheet" href="/parent-styles.css" />
  </head>
  <body>
    <script>
      const formSchema = {
        title: "SmartFormIO Checkbox Demo",
        description:
          "This form demonstrates checkbox input types and their features",
        validateOnChange: true,
        fields: [
          {
            type: "checkbox",
            name: "terms",
            label: "Terms & Conditions",
            required: true,
            validationMessage: "You must accept the terms and conditions",
            description: "I agree to the terms and conditions",
          },
          {
            type: "checkbox",
            name: "newsletter",
            label: "Newsletter Subscription",
            description: "Subscribe to our newsletter for updates",
          },
          {
            type: "checkbox",
            name: "languages",
            label: "Programming Languages (Select 2-3)",
            required: true,
            minSelect: 2,
            maxSelect: 3,
            options: [
              { value: "js", label: "JavaScript" },
              { value: "py", label: "Python" },
              { value: "java", label: "Java" },
              { value: "cpp", label: "C++" },
              { value: "ruby", label: "Ruby" },
            ],
            validationMessage: "Please select 2-3 programming languages",
            display: "vertical",
          },
          {
            type: "checkbox",
            name: "notifications",
            label: "Notification Preferences (At least 1)",
            required: true,
            minSelect: 1,
            options: [
              {
                value: "email",
                label: "Email",
                description: "Receive notifications via email",
              },
              {
                value: "sms",
                label: "SMS",
                description: "Get SMS alerts for important updates",
              },
              {
                value: "push",
                label: "Push",
                description: "Enable push notifications in browser",
              },
            ],
            validationMessage: "Please select at least one notification method",
            display: "vertical",
          },
        ],
      };
    </script>

    <smart-form-io id="myForm"></smart-form-io>

    <script type="module" src="/dist/smartformio.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formElement = document.getElementById("myForm");
        formElement.setAttribute("schema", JSON.stringify(formSchema));

        formElement.addEventListener("smartformio:submit", (e) => {
          console.log("Form submitted with data:", e.detail);
        });
      });
    </script>
  </body>
</html>
