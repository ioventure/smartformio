<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartFormIO Demo</title>
    <!-- Include the parent application's stylesheet -->
    <link rel="stylesheet" href="parent-styles.css" />
  </head>
  <body>
    <!-- Define the form schema as a script variable -->
    <script>
      const formSchema = {
        // title: "User Preferences",
        fields: [
          {
            type: "text",
            name: "withLabel",
            label: "With Label",
            required: true,
            placeholder: "With Label",
          },
          {
            type: "text",
            name: "withLabelAndHelpText",
            label: "With Label and Help Text",
            required: true,
            placeholder: "With Label and Help Text",
            helpText: "This is a help text",
          },
          {
            type: "text",
            name: "errorText",
            required: true,
            placeholder: "Error Text",
            validationMessage: "This is a validation error message",
          },
          {
            type: "text",
            name: "disabledText",
            required: true,
            disabled: true,
            placeholder: "Disabled Text",
          },
          {
            type: "email",
            name: "leadingIcon",
            required: true,
            placeholder: "Leading Icon",
            leadingIcon: "@",
          },
          {
            type: "text",
            name: "trailingIcon",
            required: true,
            placeholder: "Trailing Icon",
            trailingIcon: "$",
          },
        ],
      };
    </script>

    <!-- SmartFormIO component -->
    <smart-form-io id="myForm"></smart-form-io>

    <!-- Include the component bundle -->
    <script type="module" src="./dist/smartformio.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const formElement = document.getElementById("myForm");
        formElement.setAttribute("schema", JSON.stringify(formSchema));

        formElement.addEventListener("smartformio:submit", (e) => {
          console.log("Form submitted with data:", e.detail);
        });
      });
    </script>
  </body>
</html>
